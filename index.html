<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>伟大航路模拟器 V2 · RPG 完整版</title><style>
*{box-sizing:border-box}body{margin:0;background:#050b14;color:#edf5ff;font:14px system-ui,-apple-system,"PingFang SC",sans-serif}button{font:inherit}.app{max-width:1200px;margin:auto;padding:14px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.top{margin-bottom:12px}.brand{display:flex;gap:10px;align-items:center}.logo{font-size:28px;background:#ffd166;color:#07111f;padding:8px;border-radius:13px}.title{font-size:20px;font-weight:900}.muted{color:#8fa6bd;font-size:12px}.hero,.panel{background:linear-gradient(180deg,#0e1b2d,#091321);border:1px solid #29435e;border-radius:16px;box-shadow:0 10px 30px #0006}.hero{padding:20px;margin-bottom:12px}.hero h1{margin:0 0 5px}.hero p{color:#a8bdd2;line-height:1.6}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge,.tag{background:#0a1726;border:1px solid #29445f;border-radius:99px;padding:6px 9px;font-size:11px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.panel{padding:13px;margin-bottom:12px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.btn{background:#102139;color:#edf5ff;border:1px solid #29435e;border-radius:9px;padding:8px 11px;cursor:pointer}.btn:hover{border-color:#668db2}.primary{background:#ffd166;color:#07111f;border:0;font-weight:800}.danger{color:#ff9ca7}.active{border-color:#ffd166;color:#ffd166}.hidden{display:none}.stats,.cards,.map{display:grid;gap:8px}.stats{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.map{grid-template-columns:repeat(5,1fr)}.card,.island{background:#081421;border:1px solid #27425c;border-radius:12px;padding:10px}.island{min-height:85px;cursor:pointer}.island.lock{opacity:.35;cursor:not-allowed}.island.sel{border-color:#ffd166;box-shadow:0 0 0 1px #ffd16655}.card.click{cursor:pointer}.card.sel{border-color:#ffd166}.icon{font-size:27px}.stat small{color:#8fa6bd}.stat b{font-size:18px;display:block;margin-top:3px}.bar,.hp{height:8px;background:#1b2a3d;border-radius:99px;overflow:hidden;margin-top:6px}.bar i,.hp i{display:block;height:100%;background:#55c8ff}.hp i{background:#ff6472}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.log{height:210px;overflow:auto;background:#050b12;border:1px solid #1c3147;border-radius:10px;padding:9px;line-height:1.65;font-size:12px}.good{color:#54dc91}.warn{color:#ffd166}.bad{color:#ff7c89}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:14px;z-index:10}.modal.open{display:flex}.box{width:min(720px,100%);max-height:90vh;overflow:auto;background:#0c192a;border:1px solid #385675;border-radius:16px;padding:18px}.story{font-size:15px;line-height:1.8}.boss{border-color:#b75cff;background:#170e25}@media(max-width:820px){.grid{grid-template-columns:1fr}.map{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.title{font-size:16px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">☠️</div><div><div class="title">伟大航路模拟器 · V2</div><div class="muted">GRAND LINE RPG · STORY EDITION</div></div></div><div class="actions"><button class="btn" onclick="save()">💾 保存</button><button class="btn" onclick="resetGame()">↻ 重置</button></div></header>
<section class="hero"><h1>向最终岛屿进发</h1><p>探索、战斗、结盟、成长。你的选择会影响阵营声望、船员羁绊与最终结局。</p><div class="badges"><span class="badge">⭐ Lv.<b id="lv"></b></span><span class="badge">💰 <b id="berry"></b></span><span class="badge">☠️ 悬赏 <b id="bounty"></b></span><span class="badge">📖 第 <b id="chapter"></b> 章</span><span class="badge">📍 <b id="place"></b></span></div></section>
<div class="grid"><main><section class="panel"><div class="tabs"><button class="btn active" onclick="tab('adventure',this)">🗺️ 冒险</button><button class="btn" onclick="tab('story',this)">📖 剧情</button><button class="btn" onclick="tab('crew',this)">👒 船员</button><button class="btn" onclick="tab('growth',this)">🌳 成长</button><button class="btn" onclick="tab('shop',this)">🏪 商店</button><button class="btn" onclick="tab('faction',this)">⚓ 阵营</button></div><div id="adventure"></div><div id="story" class="hidden"></div><div id="crew" class="hidden"></div><div id="growth" class="hidden"></div><div id="shop" class="hidden"></div><div id="faction" class="hidden"></div></section><section class="panel"><h2>船员队伍</h2><div id="team" class="cards"></div></section></main><aside><section class="panel"><h2>当前区域</h2><div id="area"></div></section><section class="panel"><h2>战斗</h2><div id="battle"></div></section><section class="panel"><h2>航海日志</h2><div id="log" class="log"></div></section></aside></div></div><div id="modal" class="modal"><div class="box"><h2 id="mt"></h2><div id="mb"></div><button class="btn" onclick="closeModal()">关闭</button></div></div>
<script>
const islands=[['东海入口','🌊',1,120],['威士忌山峰','🏜️',2,220],['小花园','🌴',3,330],['阿拉巴斯坦','🏛️',5,600],['空岛','☁️',7,850],['水之七岛','🚂',9,1200],['香波地群岛','🌳',12,1700],['鱼人岛','🐟',15,2400],['和之国','⛩️',18,3400],['最终岛屿','🏴‍☠️',25,9000]];
const chars=[['路飞','👒','船长',28,13,110,8,'橡胶机关枪'],['索隆','⚔️','剑士',31,18,105,5,'三刀流·鬼斩'],['娜美','🍊','航海士',15,10,90,25,'雷云·宙斯'],['山治','🦵','厨师',25,17,105,9,'恶魔风脚'],['乌索普','🎯','狙击手',21,11,95,12,'火炎星'],['罗宾','🌸','考古学家',22,13,95,15,'百花缭乱']];
const chapters=[['启航','东海入口','少年们扬帆进入伟大航路。','选择相信伙伴，开始你的航海。'],['赏金猎人之夜','威士忌山峰','岛上的欢迎仪式隐藏着危险。','击败袭击者并保护船员。'],['巨人之岛','小花园','远古巨人与恐龙的传说苏醒。','探索遗迹，获得历史线索。'],['沙漠王国','阿拉巴斯坦','一个王国正在被阴谋撕裂。','决定帮助王国或追逐赏金。'],['神之国度','空岛','天空中流传着黄金与雷霆的传说。','寻找黄金钟的秘密。'],['水之都市','水之七岛','世界政府的影子开始逼近。','保护伙伴并突破封锁。'],['天龙人之地','香波地群岛','新世界的大门前，时代巨浪袭来。','选择低调航行或公开宣战。'],['深海王国','鱼人岛','海底的王国等待新的选择。','化解种族冲突。'],['武士之国','和之国','巨大的敌人控制着闭锁的国度。','集结力量发动大战。'],['最终岛屿','最终岛屿','世界最大的秘密就在前方。','做出决定，迎接你的结局。']];
const enemies=[['海贼猎人',18,9,65,70],['海军中校',25,15,90,120],['巴洛克特工',31,18,115,180],['CP特工',40,24,145,300],['新世界海贼',50,30,180,480],['霸气强者',64,39,230,800],['四皇干部',82,50,300,1400]];
const bosses=[['沙鳄鱼·克洛克达尔','🐊',75,43,360,1600],['黑足之敌','🕶️',92,55,430,2200],['世界政府王牌','⚜️',115,68,520,3200],['百兽干部','🐉',145,82,680,5000],['终焉守门人','👑',190,105,900,10000]];
const items=[['生命药剂','🧪','回复60生命','heal',60,120],['攻击强化','⚔️','永久攻击+5','atk',5,500],['防御强化','🛡️','永久防御+5','def',5,500],['航海图','🧭','航海+8','nav',8,450]];
const skills=[['武装色','arm','攻击+8','atk',8,1],['见闻色','obs','闪避+5%','dodge',5,1],['霸王色','king','攻击+15','atk',15,3],['船医训练','med','生命+40','maxHp',40,2]];
let S=load()||{lv:1,xp:0,berry:1200,bounty:0,island:0,chapter:0,hp:100,maxHp:100,atk:18,def:12,nav:10,crew:[0],active:0,team:[0],bond:{},skills:[],factions:{pirate:10,marine:0,revo:0,civilian:0},inventory:[],kills:0,bosses:0,flags:{},log:['<span class="good">欢迎来到伟大航路。</span>']};
function load(){try{return JSON.parse(localStorage.getItem('GL_FULL'))}catch(e){return null}}function save(){localStorage.setItem('GL_FULL',JSON.stringify(S));toast('航海档案已保存')}function resetGame(){if(confirm('确定重置全部进度？')){localStorage.removeItem('GL_FULL');location.reload()}}function toast(x){let e=document.createElement('div');e.textContent=x;e.style='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17304a;border:1px solid #5b7b98;padding:9px 14px;border-radius:10px;z-index:30';document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}
function total(k){return S[k]+(S.skills.includes('arm')&&k==='atk'?8:0)+(S.skills.includes('king')&&k==='atk'?15:0)+(S.skills.includes('med')&&k==='maxHp'?40:0)}function xpNeed(){return 100+S.lv*75}function gainXP(n){S.xp+=n;while(S.xp>=xpNeed()){S.xp-=xpNeed();S.lv++;S.maxHp+=18;S.hp=S.maxHp;S.atk+=4;S.def+=3;S.nav+=2;S.bounty+=500;log('⭐ 升级！现在是 Lv.'+S.lv,'good')}}
function log(x,c=''){S.log.unshift('<div class="'+c+'">'+x+'</div>');S.log=S.log.slice(0,70);document.getElementById('log').innerHTML=S.log.join('')}
function tab(id,el){['adventure','story','crew','growth','shop','faction'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.tabs .btn').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}
function render(){document.getElementById('lv').textContent=S.lv;document.getElementById('berry').textContent=S.berry+' 贝里';document.getElementById('bounty').textContent=S.bounty;document.getElementById('chapter').textContent=S.chapter+1;document.getElementById('place').textContent=islands[S.island][0];renderAdventure();renderStory();renderCrew();renderGrowth();renderShop();renderFaction();renderTeam();renderArea();renderBattle();document.getElementById('log').innerHTML=S.log.join('')}
function renderAdventure(){let a=document.getElementById('adventure');a.innerHTML='<h2>船长状态</h2><div class="stats"><div class="card"><small>生命</small><b>'+S.hp+'/'+total('maxHp')+'</b><div class="bar"><i style="width:'+Math.max(0,S.hp/total('maxHp')*100)+'%"></i></div></div><div class="card"><small>攻击</small><b>'+total('atk')+'</b></div><div class="card"><small>防御</small><b>'+total('def')+'</b></div><div class="card"><small>航海</small><b>'+total('nav')+'</b></div></div><p class="muted">XP '+S.xp+' / '+xpNeed()+'</p><h2>伟大航路</h2><div class="map">'+islands.map((x,i)=>'<div class="island '+(S.lv<x[2]?'lock ':'')+(i===S.island?'sel':'')+'" onclick="travel('+i+')"><span>'+x[1]+' '+x[0]+'</span><strong>Lv.'+x[2]+'+</strong><small>推荐奖励 '+x[3]+'</small></div>').join('')+'</div>'}
function travel(i){if(S.lv<islands[i][2])return toast('等级不足，需要 Lv.'+islands[i][2]);S.island=i;S.chapter=Math.max(S.chapter,i);log('⛵ 航行至 '+islands[i][0],'good');if(i===9&&S.lv>=25)openModal('最终岛屿','<div class="story">你终于抵达世界尽头。真正的宝藏与真相等待着你。</div><div class="actions"><button class="btn primary" onclick="ending(\'freedom\')">追求自由</button><button class="btn" onclick="ending(\'truth\')">揭开真相</button><button class="btn" onclick="ending(\'king\')">成为海上王者</button></div>');render()}
function renderStory(){let c=chapters[S.chapter];document.getElementById('story').innerHTML='<h2>第'+(S.chapter+1)+'章 · '+c[0]+'</h2><div class="story">'+c[2]+'</div><p>'+c[3]+'</p><div class="actions"><button class="btn primary" onclick="storyChoice(0)">帮助当地人</button><button class="btn" onclick="storyChoice(1)">追逐敌人</button><button class="btn" onclick="storyChoice(2)">寻找秘密</button></div><h3>章节进度</h3>'+chapters.map((x,i)=>'<div class="row"><span>'+(i<=S.chapter?'✅':'🔒')+' '+(i+1)+'. '+x[0]+'</span><span class="muted">'+islands[i][0]+'</span></div>').join('')}
function storyChoice(n){let rewards=[{berry:350,pirate:5,civilian:8},{berry:600,marine:-3,pirate:8},{berry:250,revo:6}][n];S.berry+=rewards.berry;Object.keys(S.factions).forEach(k=>{if(rewards[k])S.factions[k]+=rewards[k]});gainXP(60+S.chapter*20);S.flags['chapter'+S.chapter+'choice']=n;log('📖 你在'+chapters[S.chapter][0]+'做出了选择。','warn');if(S.chapter<9){S.chapter++;S.island=Math.max(S.island,S.chapter)}render();save()}
function renderCrew(){document.getElementById('crew').innerHTML='<h2>伙伴与羁绊</h2><p class="muted">点击招募伙伴；每次共同战斗会提升羁绊。</p><div class="cards">'+chars.map((c,i)=>{let own=S.crew.includes(i);return '<div class="card click '+(S.active===i?'sel':'')+'" onclick="selectChar('+i+')"><div class="icon">'+c[1]+'</div><b>'+c[0]+'</b><div class="muted">'+c[2]+'</div><span class="tag">攻击 '+c[3]+' · 防御 '+c[4]+'</span><p>技能：'+c[7]+'</p><small>'+ (own?'羁绊 '+(S.bond[i]||0):'未招募 · '+(300+i*350)+' 贝里')+'</small></div>'}).join('')+'</div>'}
function selectChar(i){if(!S.crew.includes(i)){let cost=300+i*350;if(S.berry<cost)return toast('贝里不足');S.berry-=cost;S.crew.push(i);S.bond[i]=0;log('👒 '+chars[i][0]+' 加入了队伍！','good')}S.active=i;S.team=[i];render();save()}
function renderGrowth(){document.getElementById('growth').innerHTML='<h2>技能树 · 霸气与成长</h2><div class="cards">'+skills.map(s=>'<div class="card"><b>'+s[0]+'</b><p class="muted">'+s[2]+'</p><span class="tag">需要 '+s[5]+' 点技能</span><div class="actions"><button class="btn '+(S.skills.includes(s[1])?'active':'primary')+'" '+(S.skills.includes(s[1])?'disabled':'')+' onclick="learn(\''+s[1]+'\')">'+(S.skills.includes(s[1])?'已掌握':'学习 · '+(s[5]*600)+' 贝里')+'</button></div></div>').join('')+'</div><h3>已掌握</h3><p>'+ (S.skills.length?S.skills.join('、'):'暂无')+'</p>'}
function learn(k){let s=skills.find(x=>x[1]===k);if(S.skills.includes(k))return;if(S.berry<s[5]*600)return toast('贝里不足');S.berry-=s[5]*600;S.skills.push(k);if(k==='med'){S.maxHp+=40;S.hp+=40}log('👁️ 学会技能：'+s[0],'good');render();save()}
function renderShop(){document.getElementById('shop').innerHTML='<h2>海上商店</h2><div class="cards">'+items.map((it,i)=>'<div class="card"><div class="icon">'+it[1]+'</div><b>'+it[0]+'</b><p class="muted">'+it[2]+'</p><button class="btn primary" onclick="buy('+i+')">购买 · '+it[5]+'</button></div>').join('')+'</div>'}
function buy(i){let x=items[i];if(S.berry<x[5])return toast('贝里不足');S.berry-=x[5];if(x[3]==='heal')S.hp=Math.min(total('maxHp'),S.hp+x[4]);else S[x[3]]+=x[4];log('🛒 购买 '+x[0],'good');render();save()}
function renderFaction(){let f=[['pirate','🏴‍☠️ 海贼'],['marine','⚓ 海军'],['revo','🔥 革命军'],['civilian','🏝️ 民众']];document.getElementById('faction').innerHTML='<h2>阵营声望</h2><p class="muted">你的剧情选择会改变声望，并影响部分事件。</p>'+f.map(x=>'<div class="row"><b>'+x[1]+'</b><span>'+S.factions[x[0]]+'</span></div>').join('')+'<div class="actions"><button class="btn" onclick="factionEvent()">寻找阵营任务</button></div>'}
function factionEvent(){let keys=Object.keys(S.factions),k=keys[Math.floor(Math.random()*keys.length)];S.factions[k]+=3;S.berry+=180;gainXP(40);log('⚓ 完成了 '+k+' 阵营的小型委托。','good');render();save()}
function renderTeam(){document.getElementById('team').innerHTML=S.team.map(i=>{let c=chars[i];return '<div class="card"><div class="icon">'+c[1]+'</div><b>'+c[0]+'</b><p>'+c[7]+'</p><span class="tag">羁绊 '+(S.bond[i]||0)+'</span></div>'}).join('')}
function renderArea(){let x=islands[S.island];document.getElementById('area').innerHTML='<div class="icon">'+x[1]+'</div><h3>'+x[0]+'</h3><p class="muted">推荐等级 Lv.'+x[2]+' · 奖励 '+x[3]+'</p><div class="actions"><button class="btn primary" onclick="explore()">🔭 探索</button><button class="btn" onclick="encounter(false)">⚔️ 遭遇战</button><button class="btn" onclick="encounter(true)">👑 Boss</button></div>'}
let B=null;function renderBattle(){let e=document.getElementById('battle');if(!B)return e.innerHTML='<p class="muted">尚未进入战斗。</p>';e.innerHTML='<div class="card boss"><div class="row"><b>'+B.name+'</b><span>HP '+B.hp+'/'+B.max+'</span></div><div class="hp"><i style="width:'+Math.max(0,B.hp/B.max*100)+'%"></i></div><p>攻击 '+B.atk+' · 防御 '+B.def+'</p></div><div class="actions"><button class="btn primary" onclick="attack()">⚔️ 普攻</button><button class="btn" onclick="skillAttack()">🔥 技能</button><button class="btn" onclick="useItem()">🧪 治疗</button><button class="btn danger" onclick="flee()">撤退</button></div>'}
function encounter(isBoss){if(B)return toast('正在战斗中');if(isBoss&&S.lv<islands[S.island][2]+3)return toast('Boss 需要更高等级');let e;if(isBoss){let bi=Math.min(bosses.length-1,Math.floor(S.island/2));let x=bosses[bi];e={name:x[0],atk:x[2],def:x[3],hp:x[4],max:x[4],reward:x[5],boss:true}}else{let x=enemies[Math.min(enemies.length-1,Math.floor(S.lv/4)+Math.floor(Math.random()*2))];e={name:x[0],atk:x[1],def:x[2],hp:x[3],max:x[3],reward:x[4],boss:false}}B=e;log('⚔️ 遭遇 '+e.name+(e.boss?'（Boss）':''),'warn');renderBattle()}
function attack(){if(!B)return;let dmg=Math.max(1,total('atk')-B.def+Math.floor(Math.random()*10));B.hp-=dmg;log('⚔️ 你造成 '+dmg+' 点伤害。');enemyTurn();checkBattle()}
function skillAttack(){if(!B)return;let c=chars[S.active],dmg=Math.max(1,total('atk')*1.55-B.def+Math.floor(Math.random()*15));B.hp-=Math.floor(dmg);S.bounty+=B.boss?1500:100;log('🔥 '+c[0]+' 使用「'+c[7]+'」，造成 '+Math.floor(dmg)+' 点伤害。','good');enemyTurn();checkBattle()}
function enemyTurn(){if(!B||B.hp<=0)return;let dmg=Math.max(1,B.atk-total('def')+Math.floor(Math.random()*8));S.hp-=dmg;log('💥 '+B.name+' 造成 '+dmg+' 点伤害。','bad');if(S.hp<=0){S.hp=Math.ceil(total('maxHp')*.35);B=null;log('🏥 你被救回船上，生命恢复至35%。','warn')}}
function checkBattle(){if(B&&B.hp<=0){let r=B.reward;S.berry+=r;S.kills++;if(B.boss)S.bosses++;gainXP(B.boss?180:70);S.bounty+=B.boss?1200:150;S.bond[S.active]=(S.bond[S.active]||0)+1;log('🏆 击败 '+B.name+'，获得 '+r+' 贝里！','good');B=null;render();save()}}
function useItem(){if(!B)return;S.hp=Math.min(total('maxHp'),S.hp+60);log('🧪 使用生命药剂。','good');enemyTurn();checkBattle();render()}
function flee(){if(!B)return;B=null;log('🏃 你撤离了战场。','warn');render()}
function explore(){S.berry+=50+S.island*30;S.explore=(S.explore||0)+1;gainXP(35);let r=Math.random();if(r<.25){S.berry+=300;log('💎 发现隐藏宝箱！额外获得300贝里。','good')}else if(r<.5){S.hp=Math.max(1,S.hp-15);log('🌪️ 遭遇危险海域，损失15生命。','bad')}else log('🔭 探索 '+islands[S.island][0]+'，发现了新的线索。','good');render();save()}
function ending(type){S.flags.ending=type;S.bounty+=5000;let t={freedom:'自由的航海家',truth:'揭开世界真相的人',king:'新的海上王者'}[type];openModal('结局达成','<div class="story">恭喜！你以「'+t+'」的身份完成了伟大航路。你的传奇将被世人传唱。</div><p>击败敌人：'+S.kills+' · Boss：'+S.bosses+' · 悬赏金：'+S.bounty+'</p>');log('🏁 你达成结局：'+t,'good');save()}
function openModal(t,b){document.getElementById('mt').textContent=t;document.getElementById('mb').innerHTML=b;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}render();
</script></body></html>
